<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>super and sub script tag</title>
</head>
<body>
    <big>(a+b)2=a2+b2+2ab</big><hr>
    <big>(a+b)<sup>2</sup>=a<sup>2</sup>+b<sup>2</sup>+2ab</big><hr>
    <big>H<sub>2</sub>+O<sub>2</sub>=>H<sub>2</sub>O</big><HR>
        <big>f<sub>1</sub>=-f<sub>2</sub></big><hr>  
</body>
</html>
